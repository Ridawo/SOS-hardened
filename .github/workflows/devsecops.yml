# Pipeline DevSecOps (PAI-4, SSII) para SOS-hardened.
# Integra 4 herramientas de seguridad (SCA, SAST, DAST, IaC/contenedor) repartidas en
# jobs independientes que se ejecutan en paralelo, sube cada informe a DefectDojo,
# avisa (anotacion ::warning::) cuando una herramienta supera su umbral, aplica un
# quality gate bloqueante sobre el SCA y solo entrega la imagen si el gate pasa.
#
#   sca ----------------------------------------\
#   sast ---------------------------------------+--> evidencias --\
#   iac  ---------------------------------------+                  +--> release
#   build --> container (Trivy image) ----------+--> gate ---------/
#         \-> dast (ZAP baseline) --------------/
#
# Las acciones se fijan por el SHA del commit de su version y las imagenes de las
# herramientas por su digest (cadena de suministro: una etiqueta como v4 o 0.58.1 se
# puede mover, un SHA o un digest no). La etiqueta se deja al lado como referencia.
#
# El workflow original sin seguridad (cicd.yaml) se conserva como referencia historica.
name: DevSecOps

on: [push, pull_request]

# Los jobs solo leen el repo (checkout); los artefactos no usan GITHUB_TOKEN.
permissions:
  contents: read

# El DAST usa el puerto 8080 y la imagen sos-hardened:ci del daemon Docker del runner,
# que es el mismo para todos los jobs: dos ejecuciones a la vez se pisarian.
concurrency:
  group: devsecops
  cancel-in-progress: false

env:
  # DefectDojo en localhost:8082 (8081 estaba ocupado por otro contenedor).
  # La clave de la API NO va aqui: se pasa solo a los pasos que suben informes, para
  # que no la vean npm ci ni las herramientas.
  DEFECTDOJO_URL: http://localhost:8082

jobs:
  # ---------------------------------------------------------------- SCA
  sca:
    name: SCA - npm audit
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      # Solo npm ci: instala exactamente lo del package-lock.json. Un "|| npm install"
      # podria resolver otras versiones justo en la etapa que audita dependencias.
      # --ignore-scripts: para auditar no hace falta ejecutar los scripts de instalacion
      # de las dependencias, que serian codigo de terceros corriendo en el runner.
      - name: Install dependencies (backend)
        run: npm ci --ignore-scripts

      - name: SCA - npm audit
        continue-on-error: true
        run: npm audit --json > npm-audit.json || true

      # Se usa el python3 del sistema del runner (self-hosted Kali): actions/setup-python
      # descarga binarios para Ubuntu y suele fallar en Kali. Los scripts solo usan stdlib.
      - name: Upload SCA report to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: python3 devsecops/scripts/upload_to_defectdojo.py --scan-type "NPM Audit v7+ Scan" --file npm-audit.json --test-title "npm audit (SCA)"

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-sca
          path: npm-audit.json
          if-no-files-found: warn
          overwrite: true

  # --------------------------------------------------------------- SAST
  sast:
    name: SAST - Semgrep
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: SAST - Semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4 \
            semgrep scan --metrics=off \
              --config devsecops/config/semgrep.yml \
              --config p/javascript --config p/nodejs --config p/expressjs --config p/security-audit \
              --json --output semgrep.json .

      - name: Upload SAST report to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: python3 devsecops/scripts/upload_to_defectdojo.py --scan-type "Semgrep JSON Report" --file semgrep.json --test-title "Semgrep (SAST)"

      - name: Aviso - umbral Semgrep (WARNING o ERROR)
        if: always()
        run: python3 devsecops/scripts/check_aviso.py --tool semgrep --file semgrep.json

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-sast
          path: semgrep.json
          if-no-files-found: warn
          overwrite: true

      # El contenedor de Semgrep escribe como root en el workspace y en un runner
      # propio eso rompe el checkout de la siguiente ejecucion.
      - name: Give workspace back to the runner user
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" --entrypoint chown \
            semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4 -R "$(id -u):$(id -g)" /w || true

  # ---------------------------------------------------------- IaC (Trivy)
  iac:
    name: IaC - Trivy config
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Trivy - IaC config scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            config --config devsecops/config/trivy.yaml --format json --output trivy-config.json .

      - name: Upload Trivy IaC report to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: python3 devsecops/scripts/upload_to_defectdojo.py --scan-type "Trivy Scan" --file trivy-config.json --test-title "Trivy config (IaC)"

      - name: Aviso - umbral Trivy config (HIGH o CRITICAL)
        if: always()
        run: python3 devsecops/scripts/check_aviso.py --tool trivy-config --file trivy-config.json

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-iac
          path: trivy-config.json
          if-no-files-found: warn
          overwrite: true

      - name: Give workspace back to the runner user
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" --entrypoint chown \
            semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4 -R "$(id -u):$(id -g)" /w || true

  # ---------------------------------------------------------------- Build
  # Construye la imagen una sola vez. Los jobs container y dast la usan: al correr
  # todos en el mismo runner comparten el daemon Docker y la ven por su etiqueta.
  build:
    name: Build - imagen de la app
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # El Dockerfile ya compila el frontend (npm run build), por eso no hay un
      # paso aparte para ello.
      - name: Build app image
        run: docker build -t sos-hardened:ci .

  # ------------------------------------------------- Contenedor (Trivy image)
  container:
    name: Container - Trivy image
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # La base de datos de CVE se guarda en el volumen trivy-cache para no bajarla en
      # cada ejecucion. Solo lo usa este job y concurrency impide dos runs a la vez,
      # asi que nunca hay dos Trivy usando la cache al mismo tiempo.
      # Montar el socket de Docker da a Trivy el mismo acceso que ya tiene el usuario
      # del runner (esta en el grupo docker para lanzar todas las herramientas), no
      # uno nuevo; por eso el runner va en una maquina dedicada a la practica.
      - name: Trivy - image scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --config devsecops/config/trivy.yaml --format json --output trivy-image.json sos-hardened:ci

      - name: Upload Trivy image report to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: python3 devsecops/scripts/upload_to_defectdojo.py --scan-type "Trivy Scan" --file trivy-image.json --test-title "Trivy image (contenedor)"

      - name: Aviso - umbral Trivy image (CRITICAL)
        if: always()
        run: python3 devsecops/scripts/check_aviso.py --tool trivy-image --file trivy-image.json

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-container
          path: trivy-image.json
          if-no-files-found: warn
          overwrite: true

      - name: Give workspace back to the runner user
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" --entrypoint chown \
            semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4 -R "$(id -u):$(id -g)" /w || true

  # ----------------------------------------------------------------- DAST
  dast:
    name: DAST - ZAP baseline
    needs: build
    timeout-minutes: 20   # si se cuelga, no bloquea el grupo de concurrencia durante 6 h
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      # La app no arranca sin JWT_SECRET/ADMIN_USER/ADMIN_PASSWORD. Se generan
      # aleatorias en cada ejecucion (no hay ninguna escrita en el repo) y se pasan
      # al compose, que usa la imagen sos-hardened:ci.
      - name: DAST - start app (docker compose)
        continue-on-error: true
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_USER="admin-$(openssl rand -hex 4)"
          export ADMIN_PASSWORD="$(openssl rand -hex 16)"
          # Limpia restos de una ejecucion cancelada y fija el nombre del proyecto
          # (la red sera siempre sos-hardened_default, aunque cambie el directorio).
          docker rm -f sos-hardened || true
          docker compose -p sos-hardened -f docker-compose.app.yml up -d

      - name: DAST - wait for app
        continue-on-error: true
        run: npx wait-on http://localhost:8080 --timeout 60000

      - name: DAST - ZAP baseline scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://localhost:8080 -x zap.xml -c devsecops/config/.zap/rules.tsv

      - name: DAST - stop app (docker compose)
        if: always()
        run: |
          docker rm -f sos-hardened || true
          docker network rm sos-hardened_default || true

      - name: Upload DAST report to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: python3 devsecops/scripts/upload_to_defectdojo.py --scan-type "ZAP Scan" --file zap.xml --test-title "ZAP baseline (DAST)"

      - name: Aviso - umbral ZAP (riesgo Medium o High)
        if: always()
        run: python3 devsecops/scripts/check_aviso.py --tool zap --file zap.xml

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-dast
          path: zap.xml
          if-no-files-found: warn
          overwrite: true

      - name: Give workspace back to the runner user
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" --entrypoint chown \
            semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4 -R "$(id -u):$(id -g)" /w || true

  # ------------------------------------------------- Evidencias (etapa 7)
  # Cada job guarda su informe como un artefacto propio. Este job espera a que
  # terminen todos (aunque alguno falle), los junta en un solo artefacto
  # (devsecops-reports, 30 dias) que es la evidencia de la ejecucion. El gate no
  # lee este artefacto: descarga directamente report-sca.
  evidencias:
    name: Evidencias - informes
    needs: [sca, sast, iac, container, dast]
    if: always()
    runs-on: [self-hosted, linux]
    steps:
      - name: Download all reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: List collected reports
        run: ls -la reports || true

      - name: Upload consolidated reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: devsecops-reports
          path: reports/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # ------------------------------------------------ Quality gate (etapa 8)
  # Bloqueante. Espera a todas las herramientas para que hayan corrido y subido su
  # informe antes de que el pipeline falle. No espera a evidencias: solo necesita
  # report-sca, asi que corre en paralelo con ese job.
  gate:
    name: Quality gate - npm audit (high/critical)
    needs: [sca, sast, iac, container, dast]
    if: always()
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Download SCA report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: report-sca

      - name: Quality gate - npm audit (high/critical)
        run: python3 devsecops/scripts/check_npm_gate.py npm-audit.json

  # ------------------------------------------------ Entrega (etapa 9)
  # Solo se ejecuta si el gate pasa y la imagen se construyo y analizo en este
  # run: depende de build, container, dast, gate y evidencias sin if: always(), asi
  # que si cualquiera falla o se salta, release tambien se salta (nunca etiqueta una
  # imagen vieja que hubiera quedado en el runner). En esta
  # practica no hay entorno de produccion, asi que la entrega es simulada: la imagen
  # que ha pasado todos los controles se etiqueta como version candidata y su
  # identificador queda en el resumen del run. Con el gate en rojo este job sale
  # como "skipped": el gate bloquea la entrega.
  release:
    name: Entrega - imagen candidata (simulada)
    needs: [build, container, dast, gate, evidencias]
    runs-on: [self-hosted, linux]
    steps:
      - name: Tag release candidate
        run: |
          tag="sos-hardened:release-${GITHUB_SHA::7}"
          docker tag sos-hardened:ci "$tag"
          id="$(docker image inspect --format '{{.Id}}' "$tag")"
          echo "Imagen $tag ($id) lista para desplegar." | tee -a "$GITHUB_STEP_SUMMARY"
