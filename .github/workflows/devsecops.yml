# Pipeline DevSecOps (PAI-4, SSII) para SOS-hardened.
# Integra 4 herramientas de seguridad (SCA, SAST, DAST, IaC/contenedor) repartidas en
# jobs que se ejecutan en paralelo en los runners de GitHub (ubuntu-latest). Cuando
# terminan el SAST y el IaC, un quality gate de aviso (etapa 5c) revisa sus umbrales
# (anotaciones ::warning::, nunca bloquea). El quality gate bloqueante (etapa 8) sobre
# el SCA espera a que termine, pero no usa su resultado. Solo si el gate pasa se
# entrega la imagen (GHCR).
#
#   sca ---------------------------------------------\
#   sast ---+--> gate-aviso (5c) ---------------------+--> gate (8) ----------> release (9)
#   iac  ---/                                         |                           ^
#   build --> container (Trivy image) ----------------+--> evidencias (7) --------+
#         \-> dast (ZAP baseline) --------------------/         \--> defectdojo (7b), no bloquea
#
# Los informes llegan solos a DefectDojo, sin subirlos a mano: el job defectdojo
# (etapa 7b) entra en el tailnet de Tailscale como nodo efimero, descarga
# devsecops-reports y llama 5 veces a la API (reimport-scan) del DefectDojo que corre
# en el portatil. Es el unico job que depende de esa maquina y no bloquea nada:
# nadie lo espera (ni gate ni release). Si el portatil esta apagado, avisa con
# ::warning:: y los informes siguen en el artefacto para relanzarlo con Re-run.
#
# Las acciones se fijan por el SHA del commit de su version y las imagenes de las
# herramientas por su digest (cadena de suministro: una etiqueta como v4 o 0.58.1 se
# puede mover, un SHA o un digest no). La etiqueta se deja al lado como referencia.
#
# El workflow original sin seguridad (cicd.yaml) se conserva como referencia historica.
name: DevSecOps

# push solo en main: una rama con PR abierto se analiza una vez (la del PR) y no dos.
# El push a main (el merge del PR) publica en GHCR y sube a DefectDojo en el
# engagement CI-CD. workflow_dispatch permite lanzarlo sobre cualquier rama desde
# la pestana Actions o con gh workflow run (por ejemplo, la rama con las
# dependencias corregidas, para ver el gate en verde y la entrega).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Por defecto los jobs solo leen el repo. El unico que escribe es release (GHCR).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- SCA
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      # Solo npm ci: instala exactamente lo del package-lock.json. Un "|| npm install"
      # podria resolver otras versiones justo en la etapa que audita dependencias.
      # --ignore-scripts: para auditar no hace falta ejecutar los scripts de instalacion
      # de las dependencias, que serian codigo de terceros corriendo en el runner.
      - name: Install dependencies (backend)
        run: npm ci --ignore-scripts

      - name: SCA - npm audit
        continue-on-error: true
        run: npm audit --json > npm-audit.json || true

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-sca
          path: npm-audit.json
          if-no-files-found: warn
          overwrite: true

  # --------------------------------------------------------------- SAST
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: SAST - Semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4 \
            semgrep scan --metrics=off \
              --config devsecops/config/semgrep.yml \
              --config p/javascript --config p/nodejs --config p/expressjs --config p/security-audit \
              --json --output semgrep.json .

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-sast
          path: semgrep.json
          if-no-files-found: warn
          overwrite: true

  # ---------------------------------------------------------- IaC (Trivy)
  iac:
    name: IaC - Trivy config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Trivy - IaC config scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            config --config devsecops/config/trivy.yaml --format json --output trivy-config.json .

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-iac
          path: trivy-config.json
          if-no-files-found: warn
          overwrite: true

  # ---------------------------------------------------------------- Build
  # Construye la imagen una sola vez. Cada job de GitHub corre en una maquina nueva,
  # asi que la imagen se guarda como artefacto (docker save) y container, dast y
  # release la cargan (docker load). Es la imagen exacta que se analiza y se entrega.
  build:
    name: Build - imagen de la app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # El Dockerfile ya compila el frontend (npm run build), por eso no hay un
      # paso aparte para ello.
      - name: Build app image
        run: docker build -t sos-hardened:ci .

      - name: Export app image
        run: docker save sos-hardened:ci | gzip > app-image.tar.gz

      - name: Save app image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: app-image
          path: app-image.tar.gz
          retention-days: 1
          overwrite: true

  # ------------------------------------------------- Contenedor (Trivy image)
  container:
    name: Container - Trivy image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Download app image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: app-image

      - name: Load app image
        run: docker load -i app-image.tar.gz

      # Trivy lee la imagen a traves del socket de Docker de esta maquina de GitHub,
      # que se destruye al acabar el job.
      - name: Trivy - image scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --config devsecops/config/trivy.yaml --format json --output trivy-image.json sos-hardened:ci

      - name: Aviso - umbral Trivy image (CRITICAL)
        if: always()
        run: python3 devsecops/scripts/check_aviso.py --tool trivy-image --file trivy-image.json

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-container
          path: trivy-image.json
          if-no-files-found: warn
          overwrite: true

  # ------------------------------------------- Quality gate de aviso (etapa 5c)
  # Cuando terminan el SAST (etapa 3) y el IaC (etapa 5a) revisa sus umbrales y solo
  # avisa: deja anotaciones ::warning:: (resumen del run y pull request) y nunca
  # falla. Desemboca en el gate bloqueante final, que lo espera antes de decidir.
  gate-aviso:
    name: Quality gate de aviso (SAST + IaC)
    needs: [sast, iac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Download SAST report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: report-sast
          path: reports

      - name: Download IaC report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: report-iac
          path: reports

      - name: Aviso - SAST Semgrep (WARNING o ERROR)
        if: always()
        continue-on-error: true
        run: python3 devsecops/scripts/check_aviso.py --tool semgrep --file reports/semgrep.json

      - name: Aviso - IaC Trivy config (HIGH o CRITICAL)
        if: always()
        continue-on-error: true
        run: python3 devsecops/scripts/check_aviso.py --tool trivy-config --file reports/trivy-config.json

  # ----------------------------------------------------------------- DAST
  dast:
    name: DAST - ZAP baseline
    needs: build
    timeout-minutes: 20   # si ZAP se cuelga, el job no se queda 6 h ocupando la maquina
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # el workspace queda escribible para ZAP

      - name: Download app image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: app-image

      - name: Load app image
        run: docker load -i app-image.tar.gz

      # La app no arranca sin JWT_SECRET/ADMIN_USER/ADMIN_PASSWORD. Se generan
      # aleatorias en cada ejecucion (no hay ninguna escrita en el repo) y se pasan
      # al compose, que usa la imagen sos-hardened:ci cargada en el paso anterior.
      - name: DAST - start app (docker compose)
        continue-on-error: true
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          ADMIN_USER="admin-$(openssl rand -hex 4)"
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          export JWT_SECRET ADMIN_USER ADMIN_PASSWORD
          docker compose -p sos-hardened -f docker-compose.app.yml up -d --no-build

      # Espera a que la app responda (hasta 60 s, reintentando aunque rechace la
      # conexion). Sin dependencias nuevas: curl ya esta en el runner.
      - name: DAST - wait for app
        continue-on-error: true
        run: curl -sf -o /dev/null --retry 30 --retry-delay 2 --retry-connrefused --max-time 5 http://localhost:8080

      # El contenedor de ZAP escribe con su propio usuario (uid 1000), distinto del
      # del runner de GitHub: se da permiso de escritura en el workspace para zap.xml.
      - name: DAST - ZAP baseline scan
        continue-on-error: true
        run: |
          chmod a+w "${{ github.workspace }}"
          docker run --rm --network host \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://localhost:8080 -x zap.xml -c devsecops/config/.zap/rules.tsv

      - name: DAST - stop app (docker compose)
        if: always()
        # El compose exige estas variables tambien para "down"; aqui no importa su valor.
        run: JWT_SECRET=x ADMIN_USER=x ADMIN_PASSWORD=x docker compose -p sos-hardened -f docker-compose.app.yml down || true

      - name: Aviso - umbral ZAP (riesgo Medium o High)
        if: always()
        run: python3 devsecops/scripts/check_aviso.py --tool zap --file zap.xml

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: report-dast
          path: zap.xml
          if-no-files-found: warn
          overwrite: true

  # ------------------------------------------------- Evidencias (etapa 7)
  # Cada job guarda su informe como un artefacto propio. Este job espera a que
  # terminen todos (aunque alguno falle) y los junta en un solo artefacto
  # (devsecops-reports, 30 dias): es la evidencia de la ejecucion y lo que el job
  # defectdojo (etapa 7b) envia a DefectDojo. El gate no lo lee: descarga
  # directamente report-sca.
  evidencias:
    name: Evidencias - informes
    needs: [sca, sast, iac, container, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: List collected reports
        run: ls -la reports || true

      - name: Upload consolidated reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: devsecops-reports
          path: reports/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # ------------------------------------------ Envio a DefectDojo (etapa 7b)
  # Envia los informes de devsecops-reports a DefectDojo por su API, sin subir nada a
  # mano. DefectDojo corre en el portatil, que no es accesible desde internet: el
  # runner entra en el tailnet de Tailscale como nodo efimero (se borra al acabar el
  # job) con la etiqueta tag:ci, y la ACL del tailnet solo le deja llegar al 8082.
  # Nadie depende de este job (ni gate ni release): continue-on-error y timeout
  # evitan que un portatil apagado bloquee el pipeline o la entrega. Los PR de forks
  # no tienen secretos, asi que se saltan.
  defectdojo:
    name: Envio a DefectDojo (Tailscale)
    needs: evidencias
    if: >-
      always() && needs.evidencias.result == 'success' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        id: config
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          faltan=""
          for nombre in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEFECTDOJO_URL DEFECTDOJO_API_KEY; do
            [ -n "${!nombre}" ] || faltan="$faltan $nombre"
          done
          if [ -n "$faltan" ]; then
            echo "::warning::DefectDojo no configurado (faltan los secretos:$faltan). Los informes siguen en el artefacto devsecops-reports."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.config.outputs.configurado == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # Entra en el tailnet como nodo efimero con la etiqueta tag:ci. El cliente OAuth
      # necesita el scope auth_keys (escritura) y poder usar esa etiqueta.
      - name: Conectar a Tailscale
        if: steps.config.outputs.configurado == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c  # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Download consolidated reports
        if: steps.config.outputs.configurado == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: devsecops-reports
          path: reports

      # La cabecera con la API key va por stdin (-H @-) para que no salga en el log.
      # Los reintentos dan tiempo a que el nodo del runner se propague por el tailnet.
      - name: Comprobar que DefectDojo responde
        id: ping
        if: steps.config.outputs.configurado == 'true'
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          codigo="$(printf 'Authorization: Token %s\n' "$DEFECTDOJO_API_KEY" |
            curl -s -o /dev/null -w '%{http_code}' -H @- \
              --retry 5 --retry-delay 5 --retry-connrefused --max-time 10 \
              "${DEFECTDOJO_URL%/}/api/v2/users/?limit=1" || true)"
          if [ "$codigo" = "200" ]; then
            echo "responde=true" >> "$GITHUB_OUTPUT"
          elif [ "$codigo" = "000" ] || [ -z "$codigo" ]; then
            echo "::warning::DefectDojo no responde (portatil apagado?): los informes siguen en el artefacto devsecops-reports; relanza este job con Re-run cuando este encendido."
            echo "responde=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DefectDojo responde HTTP $codigo: revisa DEFECTDOJO_API_KEY y DEFECTDOJO_URL."
            exit 1
          fi

      # Un reimport-scan por informe. El engagement de main es "CI-CD"; en otras ramas
      # es "CI-CD rama <rama>", para que close_old_findings de una rama no cierre los
      # hallazgos de main.
      - name: Enviar informes a DefectDojo
        if: steps.ping.outputs.responde == 'true'
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_COMMIT_HASH: ${{ github.sha }}
          DD_BUILD_ID: ${{ github.run_id }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$RAMA" = "main" ]; then
            DD_ENGAGEMENT_NAME="CI-CD"
          else
            DD_ENGAGEMENT_NAME="CI-CD rama $RAMA"
          fi
          export DD_BRANCH_TAG="$RAMA" DD_ENGAGEMENT_NAME

          fallos=0
          subir() {
            python3 -I devsecops/scripts/upload_to_defectdojo.py \
              --scan-type "$1" --file "reports/$2" --test-title "$3" || fallos=$((fallos + 1))
          }
          subir "NPM Audit v7+ Scan" npm-audit.json "npm audit (SCA)"
          subir "Semgrep JSON Report" semgrep.json "Semgrep (SAST)"
          subir "Trivy Scan" trivy-config.json "Trivy config (IaC)"
          subir "Trivy Scan" trivy-image.json "Trivy image (contenedor)"
          subir "ZAP Scan" zap.xml "ZAP baseline (DAST)"

          if [ "$fallos" -gt 0 ]; then
            echo "::warning::$fallos de 5 informes no se han subido a DefectDojo. Siguen en el artefacto devsecops-reports; relanza este job con Re-run."
            exit 1
          fi
          echo "5 informes enviados a DefectDojo (engagement: $DD_ENGAGEMENT_NAME)." | tee -a "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------ Quality gate (etapa 8)
  # Unico gate bloqueante. Espera a todas las herramientas y al gate de aviso
  # (if: always(), aunque alguno falle) y corre en paralelo con evidencias. Si no hay
  # informe de SCA, la descarga falla y el gate tambien: no se da por bueno un
  # analisis que no se hizo.
  gate:
    name: Quality gate - npm audit (high/critical)
    needs: [sca, sast, iac, container, dast, gate-aviso]
    if: always()
    runs-on: ubuntu-latest
    # Solo este job puede escribir en el pull request (para el comentario de abajo).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Download SCA report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: report-sca

      - name: Quality gate - npm audit (high/critical)
        run: python3 devsecops/scripts/check_npm_gate.py npm-audit.json

      # A quien avisa el gate: si falla en un pull request, deja un comentario en el
      # PR (ademas de la X del check y del correo de GitHub al autor). En los PR de
      # forks el token es de solo lectura y el comentario falla; no importa.
      - name: Avisar en el pull request
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "El quality gate ha fallado: npm audit encuentra vulnerabilidades high o critical en las dependencias (o no hay informe de SCA). Detalle del run: $RUN_URL"

  # ------------------------------------------------ Entrega (etapa 9)
  # Solo se ejecuta si el gate pasa y la imagen se construyo y analizo en este run:
  # depende de build, container, dast, gate y evidencias sin if: always(), asi que si
  # cualquiera falla o se salta, release tambien se salta. Con el gate en rojo sale
  # como "skipped": el gate bloquea la entrega.
  # La entrega es publicar en GitHub Container Registry la misma imagen que se ha
  # analizado. Solo en el push a main o al lanzarlo con workflow_dispatch (en un
  # pull_request no se publica nada).
  release:
    name: Entrega - publicar imagen en GHCR
    needs: [build, container, dast, gate, evidencias]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download app image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: app-image

      - name: Publish release image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          docker load -i app-image.tar.gz
          image="ghcr.io/${OWNER,,}/sos-hardened:release-${GITHUB_SHA::7}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag sos-hardened:ci "$image"
          docker push "$image"
          echo "Imagen $image publicada en GHCR." | tee -a "$GITHUB_STEP_SUMMARY"
